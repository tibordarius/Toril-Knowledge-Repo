[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toril-knowledge"
version = "0.1.0"
description = "Schema-first Markdown sourcebook extraction pipeline."
requires-python = ">=3.11"
dependencies = ["openai>=1.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
toril = "toril_knowledge.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]


[tool.setuptools.package-data]
"toril_knowledge.data" = ["*.json"]
